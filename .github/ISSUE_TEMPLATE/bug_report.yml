name: 🐞 Bug report
description: Report a bug in the mod
title: "[Bug]: "
labels: ["bug"]
assignees:
  - agzes
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for taking the time to report this bug!
        Please fill out the form below.
  - type: input
    id: version
    attributes:
      label: AFR version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Fabric Loader / Java
      placeholder: "0.14.23 / 17"
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mod list (optional)
      placeholder: "Fabric API, owo-lib, ..."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open AFR
        2. ...
        3. Bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots (optional)
      description: latest.log, runClient output or a screenshot
      render: text
