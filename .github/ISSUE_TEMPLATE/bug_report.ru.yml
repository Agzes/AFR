name: 🐞 Баг-репорт
description: Сообщить о проблеме в моде
title: "[Bug]: "
labels: ["bug"]
assignees:
  - agzes
body:
  - type: markdown
    attributes:
      value: |
        ## Спасибо, что сообщаете о проблеме!
        Заполните форму ниже.
  - type: input
    id: version
    attributes:
      label: Версия AFR
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: ОС
      options:
        - Windows
        - Linux
        - macOS
        - Другая
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Fabric Loader / Java
      placeholder: "0.14.23 / 17"
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Список модов (необязательно)
      placeholder: "Fabric API, owo-lib, ..."
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть AFR
        2. ...
        3. Баг
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      placeholder: Что должно было произойти?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      placeholder: Что произошло на самом деле?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи / скриншоты (необязательно)
      description: latest.log, вывод runClient или скриншот
      render: text
