name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify tag matches version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match v$VERSION in gradle.properties"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace --dependency-verification=strict

      - name: Prepare release assets
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'afr-*.jar' ! -name '*-sources.jar' | head -n1)
          if [ -z "$JAR" ]; then
            echo "No mod jar found in build/libs"
            exit 1
          fi
          (cd build/libs && sha256sum "$(basename "$JAR")" > SHA256SUMS.txt)
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=()
          case "${GITHUB_REF_NAME}" in
            *-*) ARGS+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "$JAR" build/libs/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${ARGS[@]}"
