name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify tag matches version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match v$VERSION in gradle.properties"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace --dependency-verification=strict

      - name: Prepare release assets
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'afr-*.jar' ! -name '*-sources.jar' | head -n1)
          if [ -z "$JAR" ]; then
            echo "No mod jar found in build/libs"
            exit 1
          fi
          (cd build/libs && sha256sum "$(basename "$JAR")" > SHA256SUMS.txt)
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Prepare release notes
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          version = next(
              line.split("=", 1)[1].strip()
              for line in pathlib.Path("gradle.properties").read_text(encoding="utf-8").splitlines()
              if line.startswith("version=")
          )

          def section(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              match = re.search(
                  r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
                  text,
                  re.MULTILINE | re.DOTALL,
              )
              return match.group(1).strip() if match else ""

          en = section("CHANGELOG.md")
          ru = section("CHANGELOG.ru.md")
          missing = [
              name
              for name, body in (("CHANGELOG.md", en), ("CHANGELOG.ru.md", ru))
              if not body
          ]
          if missing:
              print("No [%s] section in: %s" % (version, ", ".join(missing)))
              sys.exit(1)

          mod = json.loads(
              pathlib.Path("src/main/resources/fabric.mod.json").read_text(encoding="utf-8")
          )
          depends = mod.get("depends") or {}

          def floor(value):
              value = str(value).strip()
              for prefix in (">=", ">", "^"):
                  if value.startswith(prefix):
                      return value[len(prefix):].strip() + "+"
              if value.startswith("~"):
                  return value[1:].strip()
              return value

          requirements = [
              (name, key, floor(depends.get(key, "")))
              for name, key in (
                  ("Minecraft", "minecraft"),
                  ("Fabric Loader", "fabricloader"),
                  ("Fabric API", "fabric-api"),
                  ("owo-lib", "owo"),
                  ("Java", "java"),
              )
              if depends.get(key)
          ]

          links = {
              "owo": " ([Modrinth](https://modrinth.com/mod/owo-lib) • "
              "[CurseForge](https://www.curseforge.com/minecraft/mc-mods/owo-lib) • "
              "[GitHub](https://github.com/wisp-forest/owo-lib))",
          }

          lines = ["## Requirements / Требования", ""]
          lines += [
              "- %s **%s**%s" % (name, value, links.get(key, ""))
              for name, key, value in requirements
          ]
          lines += [
              "",
              "<details>",
              "<summary><b>Changelog (English)</b></summary>",
              "",
              en,
              "",
              "</details>",
              "",
              "<details>",
              "<summary><b>Changelog (Русский)</b></summary>",
              "",
              ru,
              "",
              "</details>",
              "",
              "**Full Changelog**: https://github.com/%s/commits/%s"
              % (os.environ["REPO"], os.environ["TAG"]),
              "",
          ]
          pathlib.Path("build/release-notes.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=()
          case "${GITHUB_REF_NAME}" in
            *-*) ARGS+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "$JAR" build/libs/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file build/release-notes.md \
            "${ARGS[@]}"
