name: Check & Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check versions
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          props = dict(
              line.split("=", 1)
              for line in pathlib.Path("gradle.properties").read_text(encoding="utf-8").splitlines()
              if "=" in line and not line.lstrip().startswith("#")
          )
          version = props["version"].strip()

          api = json.loads(pathlib.Path("web/api/versions/afr/stable.json").read_text(encoding="utf-8"))
          js = pathlib.Path("web/assets/app.js").read_text(encoding="utf-8")
          site_version = re.search(r'var VERSION = "([^"]+)"', js).group(1)
          site_code = int(re.search(r"var VERSION_CODE = (\d+);", js).group(1))
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          errors = []
          if api.get("version") != version:
              errors.append("stable.json version %r != %r" % (api.get("version"), version))
          if site_version != version:
              errors.append("app.js VERSION %r != %r" % (site_version, version))
          if api.get("version_code") != site_code:
              errors.append("stable.json version_code %r != app.js %r" % (api.get("version_code"), site_code))
          if not re.search(r"^## \[%s\]" % re.escape(version), changelog, re.MULTILINE):
              errors.append("CHANGELOG.md has no [%s] section" % version)
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Versions match: %s (%d)" % (version, site_code))
          PY

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace --dependency-verification=strict

      - name: Check web assets
        run: |
          node --check web/assets/app.js
          node --check web/assets/i18n.js
          node --check web/assets/i18n-extra.js
          python3 -c "compile(open('scripts/sync_library.py', encoding='utf-8').read(), 'scripts/sync_library.py', 'exec')"
          python3 - <<'PY'
          import glob, json
          for path in glob.glob('web/api/**/*.json', recursive=True):
              json.load(open(path, encoding='utf-8'))
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afr-artifacts
          if-no-files-found: error
          path: build/libs/
