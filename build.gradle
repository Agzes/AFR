plugins {
	alias(libs.plugins.fabric.loom)
	id 'maven-publish'
}

repositories {
	maven {
		name = 'Wisp Forest'
		url = 'https://maven.wispforest.io/releases/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"afr" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${libs.versions.minecraft.get()}"
	mappings loom.officialMojangMappings()
	modImplementation libs.fabric.loader
	modImplementation libs.fabric.api
	modImplementation libs.owo.lib
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
}

def gameJavaLauncher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(21)
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
	javaLauncher.set(gameJavaLauncher)
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}

tasks.matching { it.name == 'runClient' }.configureEach {
	if (project.hasProperty('afrCloud')) {
		jvmArgs "-Dafr.cloud=${project.afrCloud}"
	}
}
